name: Cazena
description: >-
  Cazena was a Waltham, Massachusetts-based enterprise software company, founded
  in 2014, that delivered a fully-managed SaaS data platform — a "Big Data as a
  Service" cloud data lake that let enterprises run analytics, machine learning,
  and data-lake workloads on managed cloud infrastructure without operating the
  underlying stack themselves. The company was backed by Andreessen Horowitz
  (a16z), North Bridge Venture Partners, and Formation 8. Cloudera agreed to
  acquire Cazena (alongside Datacoral) in June 2021, folding Cazena's managed
  SaaS data-lake technology into the Cloudera platform. Cazena no longer operates
  as an independent provider; its domain cazena.com now redirects to cloudera.com,
  and it exposes no independent public API, developer portal, or documentation.
